syntax = "proto3";
package lunarclient.websocket.subscription.v1;
import "common.proto";

message SubscribeV2Request {
  repeated lunarclient.common.v1.Uuid target_uuids = 1;
}

// A single equipped cosmetic item
message EquippedCosmetic {
  int64 id = 1;
  // further fields unknown - ignored by protobuf
}

// Conditional cosmetics (e.g. only visible in specific contexts)
message ConditionalCosmetics {
  repeated EquippedCosmetic cosmetics = 1;
  // further fields unknown
}

// Complete cosmetics data of a Lunar player
message PlayerCosmeticsPushV2 {
  lunarclient.common.v1.Uuid    player_uuid            = 1;
  lunarclient.common.v1.Color   logo_color             = 2;  // Lunar logo color in the tab list
  bool                          logo_always_show       = 3;  // Lunar+ feature
  lunarclient.common.v1.Color   plus_color             = 4;  // Lunar+ color (plus subscribers only)
  repeated ConditionalCosmetics conditional_cosmetics  = 5;
  repeated EquippedCosmetic     default_cosmetics      = 6;  // equipped cosmetics
  int32                         badge_id               = 7;  // 0 = no badge
  lunarclient.common.v1.Uuid    outfit_uuid            = 8;  // outfit UUID (if set)
}

message PlayerRadioPush {
  lunarclient.common.v1.Uuid player_uuid = 1;
}

// Response to SubscribeV2: whoever appears in cosmetic_pushes is a Lunar Client user
message SubscribeV2Response {
  repeated PlayerCosmeticsPushV2 cosmetic_pushes = 1;
  repeated PlayerRadioPush       radio_pushes    = 2;
}

message UnsubscribeRequest {
  repeated lunarclient.common.v1.Uuid target_uuids = 1;
}

message UnsubscribeResponse {}
