syntax = "proto3";
package lunarclient.websocket.setting.v1;

import "google/protobuf/any.proto";

message LauncherSetting {
    string id = 1;
    google.protobuf.Any value = 2;
    bool changed_value = 3;
    bool default_value = 4;
}

message ClientSetting {
    string id = 1;
    google.protobuf.Any value = 2;
    bool changed_value = 3;
    bool default_value = 4;
}

