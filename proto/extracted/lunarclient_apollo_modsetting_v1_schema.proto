syntax = "proto3";
package lunarclient.apollo.modsetting.v1;

import "google/protobuf/struct.proto";

message InstalledModsRequest {
    bytes request_id = 1;
}

message InstalledModsResponse {
    bytes request_id = 1;
    int32 page = 2;
    int32 total_pages = 3;
    repeated lunarclient.apollo.modsetting.v1.ModGroup mod_groups = 4;
}

message ModStatusRequest {
    bytes request_id = 1;
}

message ModStatusResponse {
    bytes request_id = 1;
    int32 page = 2;
    int32 total_pages = 3;
    repeated lunarclient.apollo.modsetting.v1.ModOptionStatus mod_options = 4;
}

message ModOptionStatus {
    string key = 1;
    google.protobuf.Value value = 2;
}

message ModGroup {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_FABRIC_INTERNAL = 1;
    TYPE_FABRIC_EXTERNAL = 2;
    TYPE_FORGE_INTERNAL = 3;
    TYPE_FORGE_EXTERNAL = 4;
  }
    lunarclient.apollo.modsetting.v1.ModGroup.Type type = 1;
    repeated lunarclient.apollo.modsetting.v1.Mod mods = 2;
}

message Mod {
    string id = 1;
    string version = 2;
}

