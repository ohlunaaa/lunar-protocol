syntax = "proto3";
package lunarclient.websocket.spray.v1;

import "lunarclient/common/v1/position.proto";
import "lunarclient/websocket/protocol/v1/common.proto";
import "lunarclient/websocket/spray/v1/common.proto";

message LoginRequest {
}

message LoginResponse {
    repeated lunarclient.websocket.spray.v1.OwnedSpray owned_sprays = 1;
    repeated lunarclient.websocket.spray.v1.EquippedSpray equipped_sprays = 2;
    bool has_all_sprays_flag = 4;
    int32 max_active_sprays = 5;
    repeated int32 lunar_plus_free_spray_ids = 6;
}

message UseSprayRequest {
    int32 spray_id = 1;
    lunarclient.common.v1.Vector3f pos = 2;
    lunarclient.common.v1.Direction facing = 3;
    float rotation = 4;
}

message UseSprayResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_SPRAY_NOT_OWNED = 2;
  }
    lunarclient.websocket.spray.v1.UseSprayResponse.Status status = 1;
}

message RemoveSprayRequest {
    lunarclient.common.v1.Vector3f pos = 1;
}

message RemoveSprayResponse {
}

message UpdateEquippedSpraysRequest {
    repeated lunarclient.websocket.spray.v1.EquippedSpray equipped_sprays = 1;
}

message UpdateEquippedSpraysResponse {
}

service SprayService {
  rpc Login(lunarclient.websocket.spray.v1.LoginRequest) returns (lunarclient.websocket.spray.v1.LoginResponse);
  rpc UseSpray(lunarclient.websocket.spray.v1.UseSprayRequest) returns (lunarclient.websocket.spray.v1.UseSprayResponse);
  rpc RemoveSpray(lunarclient.websocket.spray.v1.RemoveSprayRequest) returns (lunarclient.websocket.spray.v1.RemoveSprayResponse);
  rpc UpdateEquippedSprays(lunarclient.websocket.spray.v1.UpdateEquippedSpraysRequest) returns (lunarclient.websocket.spray.v1.UpdateEquippedSpraysResponse);
}
