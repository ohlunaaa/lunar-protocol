syntax = "proto3";
package lunarclient.websocket.cosmetic.v2;

import "lunarclient/common/v1/color.proto";
import "lunarclient/common/v1/uuid.proto";
import "lunarclient/websocket/cosmetic/v2/common.proto";
import "lunarclient/websocket/protocol/v1/common.proto";

message LoginRequest {
}

message LoginResponse {
    lunarclient.common.v1.Color logo_color = 1;
    bool logo_always_show = 2;
    lunarclient.common.v1.Color plus_color = 3;
    repeated lunarclient.common.v1.Color available_lunar_plus_colors = 4;
    repeated int32 lunar_plus_free_cosmetic_ids = 5;
    repeated lunarclient.websocket.cosmetic.v2.OwnedCosmetic owned_cosmetics = 6;
    bool has_all_cosmetics_flag = 7;
    string rank_name = 8;
    repeated int32 favorite_cosmetic_ids = 9;
    repeated lunarclient.websocket.cosmetic.v2.Outfit outfits = 10;
    lunarclient.websocket.cosmetic.v2.OutfitTree outfit_tree = 11;
    bool artist_tools = 12;
    lunarclient.websocket.cosmetic.v2.CosmeticOwnershipVisibility cosmetic_ownership_visibility = 13;
    bool tester_tools = 14;
    repeated int32 discord_rewards = 15;
    repeated int32 discord_tag_rewards = 16;
}

message CreateOutfitRequest {
    string name = 1;
}

message CreateOutfitResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_OUTFIT_LIMIT_REACHED = 2;
  }
    lunarclient.websocket.cosmetic.v2.CreateOutfitResponse.Status status = 1;
    lunarclient.websocket.cosmetic.v2.Outfit outfit = 2;
}

message UpdateOutfitRequest {
    lunarclient.websocket.cosmetic.v2.Outfit outfit = 1;
}

message UpdateOutfitResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
  }
    lunarclient.websocket.cosmetic.v2.UpdateOutfitResponse.Status status = 1;
    lunarclient.websocket.cosmetic.v2.Outfit outfit = 2;
}

message SelectOutfitRequest {
    lunarclient.websocket.cosmetic.v2.OutfitTree outfit_tree = 1;
}

message SelectOutfitResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
  }
    lunarclient.websocket.cosmetic.v2.SelectOutfitResponse.Status status = 1;
}

message DeleteOutfitRequest {
    lunarclient.common.v1.Uuid outfit_id = 1;
}

message DeleteOutfitResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
  }
    lunarclient.websocket.cosmetic.v2.DeleteOutfitResponse.Status status = 1;
}

message FavoriteCosmeticRequest {
    int32 cosmetic_id = 1;
}

message FavoriteCosmeticResponse {
}

message UnfavoriteCosmeticRequest {
    int32 cosmetic_id = 1;
}

message UnfavoriteCosmeticResponse {
}

message LoadTabLogosRequest {
    repeated lunarclient.common.v1.Uuid player_uuids = 1;
}

message LoadTabLogosResponse {
    repeated lunarclient.websocket.cosmetic.v2.LoadTabLogosResponse.TabLogo tab_logos = 1;
  message TabLogo {
      lunarclient.common.v1.Uuid player_uuid = 1;
      lunarclient.common.v1.Color logo_color = 2;
      lunarclient.common.v1.Color plus_color = 3;
      int32 badge_id = 4;
  }
}

message SetCosmeticOwnershipVisibilityRequest {
    lunarclient.websocket.cosmetic.v2.CosmeticOwnershipVisibility visibility = 1;
}

message SetCosmeticOwnershipVisibilityResponse {
}

message UpdateLunarPlusColorRequest {
    lunarclient.common.v1.Color plus_color = 3;
}

message UpdateLunarPlusColorResponse {
}

service CosmeticService {
  rpc Login(lunarclient.websocket.cosmetic.v2.LoginRequest) returns (lunarclient.websocket.cosmetic.v2.LoginResponse);
  rpc CreateOutfit(lunarclient.websocket.cosmetic.v2.CreateOutfitRequest) returns (lunarclient.websocket.cosmetic.v2.CreateOutfitResponse);
  rpc UpdateOutfit(lunarclient.websocket.cosmetic.v2.UpdateOutfitRequest) returns (lunarclient.websocket.cosmetic.v2.UpdateOutfitResponse);
  rpc DeleteOutfit(lunarclient.websocket.cosmetic.v2.DeleteOutfitRequest) returns (lunarclient.websocket.cosmetic.v2.DeleteOutfitResponse);
  rpc SelectOutfit(lunarclient.websocket.cosmetic.v2.SelectOutfitRequest) returns (lunarclient.websocket.cosmetic.v2.SelectOutfitResponse);
  rpc FavoriteCosmetic(lunarclient.websocket.cosmetic.v2.FavoriteCosmeticRequest) returns (lunarclient.websocket.cosmetic.v2.FavoriteCosmeticResponse);
  rpc UnfavoriteCosmetic(lunarclient.websocket.cosmetic.v2.UnfavoriteCosmeticRequest) returns (lunarclient.websocket.cosmetic.v2.UnfavoriteCosmeticResponse);
  rpc LoadTabLogos(lunarclient.websocket.cosmetic.v2.LoadTabLogosRequest) returns (lunarclient.websocket.cosmetic.v2.LoadTabLogosResponse);
  rpc SetCosmeticOwnershipVisibility(lunarclient.websocket.cosmetic.v2.SetCosmeticOwnershipVisibilityRequest) returns (lunarclient.websocket.cosmetic.v2.SetCosmeticOwnershipVisibilityResponse);
  rpc UpdateLunarPlusColor(lunarclient.websocket.cosmetic.v2.UpdateLunarPlusColorRequest) returns (lunarclient.websocket.cosmetic.v2.UpdateLunarPlusColorResponse);
}
