syntax = "proto3";
package lunarclient.apollo.common.v1;

import "lunarclient/apollo/common/v1/item.proto";
import "lunarclient/apollo/common/v1/profile.proto";

message ItemStackIcon {
  oneof 
item {
  }
    int32 item_id = 1;
    string item_name = 2;
    lunarclient.apollo.common.v1.Profile profile = 4;
    lunarclient.apollo.common.v1.CustomModelData custom_model_data_object = 5;
    string potion = 6;
}

message SimpleResourceLocationIcon {
    string resource_location = 1;
    int32 size = 2;
}

message AdvancedResourceLocationIcon {
    string resource_location = 1;
    float width = 2;
    float height = 3;
    float min_u = 4;
    float max_u = 5;
    float min_v = 6;
    float max_v = 7;
}

message ResourceLocationIcon {
    string resource_location = 1;
}

message Icon {
  oneof 
contents {
  }
    lunarclient.apollo.common.v1.ItemStackIcon item_stack = 1;
    lunarclient.apollo.common.v1.SimpleResourceLocationIcon simple_resource_location = 2;
    lunarclient.apollo.common.v1.AdvancedResourceLocationIcon advanced_resource_location = 3;
    lunarclient.apollo.common.v1.ResourceLocationIcon resource_location = 4;
}

