    lunarclient.websocket.conversation.v1.UserConversationState user_state = 8;
    int32 participant_limit = 9;
    lunarclient.websocket.conversation.v1.InvitePolicy invite_policy = 10;
    lunarclient.websocket.conversation.v1.NamePolicy name_policy = 11;
    lunarclient.websocket.conversation.v1.IconPolicy icon_policy = 12;
    lunarclient.websocket.conversation.v1.MessagePinningPolicy message_pinning_policy = 13;
    lunarclient.websocket.conversation.v1.ConversationMessage latest_message = 14;
}

message UserConversationState {
    google.protobuf.Timestamp last_seen_time = 1;
    int32 unread_count = 2;
    bool pinned = 3;
}

message ConversationParticipant {
    lunarclient.common.v1.UuidAndUsername player = 1;
    lunarclient.common.v1.Color logo_color = 2;
    lunarclient.common.v1.Color plus_color = 3;
    string rank_name = 4;
    bool is_radio_premium = 5;
    int32 badge_id = 6;
}

message ConversationReference {
  oneof 
target {
  }
    lunarclient.common.v1.Uuid friend_uuid = 1;
    lunarclient.common.v1.Uuid conversation_reference = 2;
}

message ConversationSender {
  oneof 
sender {
  }
    lunarclient.common.v1.UuidAndUsername player = 1;
}

message ConversationMessageContents {
  oneof 
contents {
  }
  oneof 
_embed {
  }
    string plain_text = 1;
    lunarclient.websocket.conversation.v1.LunarSticker sticker = 2;
    lunarclient.websocket.conversation.v1.SystemMessage system = 5;
    repeated lunarclient.websocket.conversation.v1.ConversationImage images = 3;
    lunarclient.websocket.conversation.v1.ConversationMessageEmbed embed = 4;
}

message ConversationMessage {
  oneof 
_sender {
