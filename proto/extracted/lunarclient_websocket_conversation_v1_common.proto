    string url = 2;
    string name = 3;
}

message LunarStickerPack {
    string id = 1;
    string name = 2;
    string icon_url = 3;
    repeated lunarclient.websocket.conversation.v1.LunarSticker stickers = 4;
}

message LunarEmoji {
    string id = 1;
    string url = 2;
