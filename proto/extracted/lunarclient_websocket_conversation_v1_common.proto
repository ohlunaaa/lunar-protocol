    string raw_url = 1;
    string normalized_url = 2;
    string proxied_url = 3;
    string mime_type = 4;
    uint32 width = 5;
    uint32 height = 6;
    uint64 content_length = 7;
}

message LinkPreviewEmbed {
    string raw_url = 1;
    string normalized_url = 2;
    string proxied_url = 3;
    string site_name = 4;
    string title = 5;
    string description = 6;
    lunarclient.websocket.conversation.v1.OgImage image = 7;
