    lunarclient.websocket.conversation.v1.ConversationSender actor = 1;
    lunarclient.websocket.conversation.v1.SystemPinnedMessageEvent pinned = 2;
    lunarclient.websocket.conversation.v1.SystemInviteEvent invite = 3;
    lunarclient.websocket.conversation.v1.SystemLeaveEvent leave = 4;
    lunarclient.websocket.conversation.v1.SystemNameChangeEvent name_change = 5;
    lunarclient.websocket.conversation.v1.SystemIconChangeEvent icon_change = 6;
}

message SystemPinnedMessageEvent {
    lunarclient.common.v1.Uuid pinned_message_id = 1;
}

message SystemInviteEvent {
    repeated lunarclient.common.v1.UuidAndUsername invitees = 1;
}

message SystemLeaveEvent {
    lunarclient.common.v1.UuidAndUsername player = 1;
}

message SystemNameChangeEvent {
    string new_name = 1;
}

message SystemIconChangeEvent {
    string new_icon_url = 1;
}

message ConversationMessageEmbed {
  oneof 
embed {
  }
    lunarclient.websocket.conversation.v1.ImageEmbed image = 1;
    lunarclient.websocket.conversation.v1.LinkPreviewEmbed link_preview = 2;
    google.protobuf.Timestamp captured_at = 3;
}

