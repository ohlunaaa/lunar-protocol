syntax = "proto3";
package lunarclient.websocket.notification.v1;

import "lunarclient/common/v1/uuid.proto";
import "lunarclient/websocket/notification/v1/common.proto";
import "lunarclient/websocket/protocol/v1/common.proto";

message OpenNotificationRequest {
    lunarclient.common.v1.Uuid notification_id = 1;
}

message OpenNotificationResponse {
}

message OpenAlertRequest {
    int32 alert_id = 1;
}

message OpenAlertResponse {
}

message LoginRequest {
}

message LoginResponse {
    repeated lunarclient.websocket.notification.v1.Notification notifications = 1;
}

message DeleteNotificationRequest {
    lunarclient.common.v1.Uuid notification_id = 1;
}

message DeleteNotificationResponse {
}

message MarkAllNotificationsAsReadRequest {
}

message MarkAllNotificationsAsReadResponse {
}

service NotificationService {
  rpc Login(lunarclient.websocket.notification.v1.LoginRequest) returns (lunarclient.websocket.notification.v1.LoginResponse);
  rpc OpenNotification(lunarclient.websocket.notification.v1.OpenNotificationRequest) returns (lunarclient.websocket.notification.v1.OpenNotificationResponse);
  rpc MarkAllNotificationsAsRead(lunarclient.websocket.notification.v1.MarkAllNotificationsAsReadRequest) returns (lunarclient.websocket.notification.v1.MarkAllNotificationsAsReadResponse);
  rpc OpenAlert(lunarclient.websocket.notification.v1.OpenAlertRequest) returns (lunarclient.websocket.notification.v1.OpenAlertResponse);
  rpc DeleteNotification(lunarclient.websocket.notification.v1.DeleteNotificationRequest) returns (lunarclient.websocket.notification.v1.DeleteNotificationResponse);
}
